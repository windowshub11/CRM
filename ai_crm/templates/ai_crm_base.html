<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block page_title %}Saarva Admin{% endblock %}</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Common CSS (always loaded) -->
  <link rel="stylesheet" href="/assets/ai_crm/css/variables.css">
  <link rel="stylesheet" href="/assets/ai_crm/css/common.css">
  <link rel="stylesheet" href="/assets/ai_crm/css/layout.css">

  <!-- Page-specific CSS -->
  {% block page_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  {%- if show_custom_sidebar is defined and show_custom_sidebar -%}
  {% include "templates/includes/sidebar.html" %}
  {%- endif -%}

  {%- block page_content -%}{%- endblock -%}

  <!-- CSRF Token -->
  <script>
    window.csrf_token = "{{ frappe.session.csrf_token or '' }}";
  </script>

  <!-- Common JS (always loaded) -->
  <script src="/assets/ai_crm/js/common.js"></script>

  <!-- Page-specific JS -->
  {% block page_js %}{% endblock %}

</body>
</html>
